name: iot-example-graphical-snap  # you probably want to 'snapcraft register <name>'
version: git # just for humans, typically '1.2+git' or '1.3.2'
summary: Single-line elevator pitch for your amazing snap # 79 char long summary
description: |
  This is my-snap's description. You have a paragraph or two to tell the
  most important story about your snap. Keep it under 100 words though,
  we live in tweetspace and your description wants to look good in the snap
  store.
confinement: strict
compression: lzo
grade: stable
base: core22

apps:
  iot-example-graphical-snap:
    # This sets up providing the graphics userspace needed by your application.
    # See [How to use graphics in snaps documentation](https://ubuntu.com/frame/docs/22/how-to/use-snap-graphics)
    extensions: [gpu]
    command-chain: &_command-chain
      - bin/wayland-launch
      - bin/setup-mir
      - bin/setup-x11
      - usr/local/bin/x11_kiosk_launch
    command: &_command usr/bin/glxgears
    plugs: &_plugs
      - opengl
      - wayland
      - network-bind   # For Mir (to serve X11)

  daemon:
    extensions: [gpu]
    daemon: simple
    restart-delay: 3s
    restart-condition: always
    command-chain: *_command-chain
    command: *_command
    plugs: *_plugs

environment:
  # Other, generally useful environment settings...
  # XDG config
  XDG_CACHE_HOME:  $SNAP_USER_COMMON/.cache
  XDG_CONFIG_HOME: $SNAP_USER_DATA/.config
  XDG_CONFIG_DIRS: $SNAP/etc/xdg
  XDG_DATA_DIRS:   $SNAP/usr/local/share:$SNAP/usr/share
  # XKB config
  XKB_CONFIG_ROOT: $SNAP/usr/share/X11/xkb

# The `layout` ensures that files can be found by applications where they are expected by the toolkit or application.
layout:
  # X11
  /usr/bin/xkbcomp:
    symlink: $SNAP/usr/bin/xkbcomp
  /usr/share/X11:
    bind: $SNAP/usr/share/X11

parts:
  glxgears:
    plugin: nil
    stage-packages:
      - mesa-utils

  # A simple kiosk for X11 on Wayland
  mir-kiosk-x11:
    plugin: cmake
    source: https://github.com/MirServer/mir_kiosk_x11.git
    build-packages:
      - pkg-config
      - libmiral-dev
      - make
      - g++
    stage-packages:
      - libmiral4
      - mir-platform-graphics-wayland
      - dmz-cursor-theme
      - fonts-freefont-ttf
      - xwayland
      - libbz2-1.0

  # Some utility scripts for setting up the X11/Mir
  env-setup:
    plugin: dump
    source: env-setup
    override-build: |
      sed --in-place s/\$\{CRAFT_ARCH_TRIPLET}/${CRAFT_ARCH_TRIPLET}/g $CRAFT_PART_BUILD/bin/*
      craftctl default

  # Some utility scripts for setting up the Wayland environment
  setup:
    plugin: dump
    source: wayland-launch
    override-build: |
      # The plugs needed to run Wayland. (wayland-launch checks them, setup.sh connects them)
      # You may add further plugs here if you want these options
      PLUGS="opengl wayland graphics-core22 network-bind"
      sed --in-place "s/%PLUGS%/$PLUGS/g" $CRAFT_PART_BUILD/bin/wayland-launch
      sed --in-place "s/%PLUGS%/$PLUGS/g" $CRAFT_PART_BUILD/bin/setup.sh
      craftctl default
    stage-packages:
      - inotify-tools

  cleanup:
    after:
      - glxgears
      - mir-kiosk-x11
      - env-setup
      - setup
    plugin: nil
    override-prime: |
      craftctl default
      cd "$CRAFT_PRIME/usr/share/"
      rm -rf applications apport bash-completion dbus-1 doc-base doc gtk-doc\
             help lintian pkgconfig libthai man metainfo themes thumbnailers xml

architectures:
  - build-on: amd64
  - build-on: armhf
  - build-on: arm64
